
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RIFTBOUND TACTICS</title>
<style>
:root{
  --bg:#090d17;--panel:#121b2b;--panel2:#1a263a;
  --gold:#e8bd70;--blue:#59c8ff;--red:#ff6b78;
  --green:#7ce0a0;--text:#e9f0ff;--muted:#9eacc3;
}
*{box-sizing:border-box}
body{
  margin:0;background:
  radial-gradient(ellipse at top,#1b2941 0%,#090d17 65%);
  color:var(--text);font-family:system-ui,-apple-system,sans-serif;
}
button{font:inherit;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
header{
  display:flex;justify-content:space-between;align-items:center;
  gap:12px;padding:14px 18px;border-bottom:1px solid #ffffff18;
  background:#080c15dd;position:sticky;top:0;z-index:5;
}
.logo{font-size:19px;font-weight:950;letter-spacing:2px;color:var(--gold)}
.logo small{display:block;font-size:10px;letter-spacing:3px;color:var(--muted)}
.topstats{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:#182337;border:1px solid #ffffff16;border-radius:9px;padding:7px 10px;font-size:12px}
main{max-width:1300px;margin:auto;padding:16px}
h1,h2,h3,p{margin-top:0}
h2{font-size:17px;margin-bottom:12px}
.muted{color:var(--muted);font-size:12px}
button.primary{
  background:linear-gradient(135deg,#f4d28d,#c58b3c);color:#1c1720;
  border:0;border-radius:9px;padding:10px 15px;font-weight:850;
}
button.secondary{
  color:var(--text);background:#24334a;border:1px solid #43536c;
  border-radius:8px;padding:8px 11px;
}
button:hover:not(:disabled){filter:brightness(1.13)}
#setup{max-width:1050px;margin:25px auto}
.deckgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:12px}
.deckcard{
  text-align:left;padding:15px;border-radius:13px;color:var(--text);
  border:1px solid #ffffff20;background:linear-gradient(145deg,#1a263a,#101725);
  min-height:165px;
}
.deckcard.selected{border:1px solid var(--gold);box-shadow:0 0 0 1px #e8bd7033}
.deckicon{font-size:27px;margin-bottom:7px}
.deckcard h3{margin:0 0 7px;font-size:17px}
.deckcard p{font-size:12px;color:var(--muted);line-height:1.6}
.deckmeta{font-size:11px;color:var(--gold)}
#game{display:none}
.statusbar{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-bottom:13px}
.playerbox{padding:12px;background:var(--panel);border:1px solid #ffffff15;border-radius:12px}
.playerbox.enemy{text-align:right}
.playername{font-weight:850}
.hptext{font-size:13px;margin-top:5px}
.hpbar{height:7px;background:#3b2635;border-radius:8px;margin-top:7px;overflow:hidden}
.hpfill{height:100%;background:linear-gradient(90deg,#e84f6d,#ff8b8b);transition:width .25s}
#turninfo{text-align:center;font-size:12px;color:var(--gold);min-width:90px}
.section{background:#0d1421b8;border:1px solid #ffffff14;border-radius:13px;padding:13px;margin-bottom:12px}
.lanes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.lane{
  min-width:0;background:linear-gradient(180deg,#18253a,#101725);
  border:1px solid #34445c;border-radius:11px;padding:9px;min-height:190px;
}
.lanehead{display:flex;justify-content:space-between;align-items:center;gap:4px;margin-bottom:8px}
.lanehead strong{font-size:13px}
.lanehead button{font-size:10px;padding:5px}
.units{display:flex;flex-direction:column;gap:7px}
.unit{
  background:#25334a;border:1px solid #ffffff20;border-radius:9px;
  padding:8px;font-size:11px;position:relative;
}
.unit.mine{border-left:3px solid var(--blue)}
.unit.foe{border-left:3px solid var(--red)}
.unitname{font-weight:850;margin-bottom:4px;overflow-wrap:anywhere}
.unitstats{display:flex;justify-content:space-between;gap:5px;font-weight:800}
.atk{color:#ffb4a9}.hp{color:#9beab6}
.shield{color:#8ddcff}
.empty{color:#617087;font-size:11px;text-align:center;padding:13px 3px}
.hand{
  display:flex;gap:9px;overflow-x:auto;padding:5px 2px 12px;
  align-items:stretch;
}
.card{
  flex:0 0 145px;min-height:190px;display:flex;flex-direction:column;
  text-align:left;color:var(--text);border:1px solid #5a6680;
  border-radius:11px;padding:10px;background:linear-gradient(155deg,#263752,#121b2b);
  position:relative;transition:transform .12s,border-color .12s;
}
.card:hover:not(:disabled){transform:translateY(-4px);border-color:var(--gold)}
.card .cost{
  position:absolute;right:8px;top:7px;background:#4b83ba;color:white;
  width:26px;height:26px;display:grid;place-items:center;border-radius:50%;font-weight:950;
}
.card .emoji{font-size:24px;margin:4px 0 7px}
.card .name{font-size:13px;font-weight:900;padding-right:23px;margin-bottom:6px}
.card .kind{font-size:10px;color:var(--gold);margin-bottom:7px}
.card .desc{font-size:11px;line-height:1.55;color:#c5d1e5;flex:1}
.card .stats{font-size:12px;font-weight:900;margin-top:8px}
.card.spell{background:linear-gradient(155deg,#3a2a53,#151b30)}
.card.selected{border:2px solid var(--gold);transform:translateY(-5px)}
.actionrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.actionrow .hint{font-size:11px;color:var(--muted);flex:1}
#log{
  height:105px;overflow:auto;font-size:11px;color:#bac8dc;
  line-height:1.7;background:#080e18;border-radius:8px;padding:9px;
}
.logline{border-bottom:1px solid #ffffff08;padding:2px 0}
#overlay{
  position:fixed;inset:0;z-index:20;background:#050914df;
  display:none;align-items:center;justify-content:center;padding:18px;
}
.modal{
  max-width:430px;width:100%;background:#172238;border:1px solid #e8bd7055;
  border-radius:16px;padding:24px;text-align:center;box-shadow:0 20px 80px #0009;
}
.modal h2{font-size:25px;color:var(--gold)}
.modal p{color:#b8c5d9;line-height:1.7;font-size:13px}
@media(max-width:650px){
  header{padding:11px;align-items:flex-start}
  .logo{font-size:15px}.topstats{justify-content:flex-end}
  main{padding:9px}
  .statusbar{grid-template-columns:1fr 1fr}
  #turninfo{grid-column:1/-1;grid-row:1}
  .playerbox{padding:9px}
  .lanes{gap:5px}
  .lane{padding:5px;min-height:150px}
  .lanehead{flex-direction:column;align-items:stretch}
  .lanehead strong{font-size:11px}
  .lanehead button{font-size:9px;padding:4px}
  .unit{padding:5px;font-size:10px}
  .unitname{font-size:10px}
  .card{flex-basis:132px;min-height:180px;padding:8px}
}
</style>
</head>
<body>
<header>
  <div class="logo">RIFTBOUND <span style="color:white">TACTICS</span>
    <small>STRATEGY CARD ARENA</small>
  </div>
  <div class="topstats">
    <div class="pill">⚔️ 턴 <b id="turnTop">0</b></div>
    <div class="pill">🪙 <b id="goldTop">0</b></div>
    <div class="pill">📚 덱 <b id="deckTop">0</b></div>
  </div>
</header>

<main>
<section id="setup">
  <h1>전략을 선택하라</h1>
  <p class="muted">서로 다른 여섯 가지 전술 덱 중 하나를 선택해 AI와 전투하세요.</p>
  <div class="deckgrid" id="deckGrid"></div>
  <div style="margin-top:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <label>AI 난이도
      <select id="difficulty" class="secondary" style="margin-left:7px">
        <option value="easy">쉬움</option>
        <option value="normal" selected>보통</option>
        <option value="hard">어려움</option>
      </select>
    </label>
    <button class="primary" id="startBtn">전투 시작</button>
  </div>
</section>

<section id="game">
  <div class="statusbar">
    <div class="playerbox enemy">
      <div class="playername">🔴 적의 넥서스</div>
      <div class="hptext"><span id="enemyHPText">30 / 30</span></div>
      <div class="hpbar"><div class="hpfill" id="enemyHPBar" style="width:100%"></div></div>
      <div class="muted" style="margin-top:6px">AI 마나: <b id="enemyMana">0</b></div>
    </div>
    <div id="turninfo">전투 준비</div>
    <div class="playerbox">
      <div class="playername">🔵 나의 넥서스</div>
      <div class="hptext"><span id="playerHPText">30 / 30</span></div>
      <div class="hpbar"><div class="hpfill" id="playerHPBar" style="width:100%"></div></div>
      <div class="muted" style="margin-top:6px">내 마나: <b id="playerMana">0</b></div>
    </div>
  </div>

  <section class="section">
    <div style="display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:10px">
      <h2 style="margin:0">전장 · 3개 라인</h2>
      <span class="muted">유닛은 턴 종료 시 공격</span>
    </div>
    <div class="lanes" id="lanes"></div>
  </section>

  <section class="section">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
      <h2 style="margin:0 0 5px">나의 손패</h2>
      <span class="muted" id="handCount">0장</span>
    </div>
    <p class="muted">카드를 선택한 다음 원하는 라인에 사용하세요. 주문은 선택한 라인에 효과를 적용합니다.</p>
    <div class="hand" id="hand"></div>
    <div class="actionrow">
      <button class="primary" id="endTurn">턴 종료</button>
      <button class="secondary" id="cancelCard">선택 취소</button>
      <button class="secondary" id="restart">다시 시작</button>
      <span class="hint" id="actionHint">카드를 선택하세요.</span>
    </div>
  </section>

  <section class="section">
    <h2>전투 기록</h2>
    <div id="log"></div>
  </section>
</section>
</main>

<div id="overlay">
  <div class="modal">
    <h2 id="resultTitle">전투 종료</h2>
    <p id="resultText"></p>
    <button class="primary" id="again">다시 플레이</button>
  </div>
</div>

  name:"군집 돌격 덱",icon:"🐜",color:"#7ce0a0",
  desc:"저렴한 유닛을 연속으로 배치해 수적 우위를 만든다.",
  cards:["swarmling","swarmling","swarmling","swarmling","swift_scout","swift_scout","wolf_raider","wolf_raider","swarm_hunter","swarm_hunter","pack_alpha","pack_alpha","blade_dancer","blade_dancer","dragon_whelp","field_medic","rune_mage","shield_captain","battle_banner","storm_archer","fire_bolt","fire_bolt","tactical_draw","tactical_draw","rally","rally","fortify_line","supply_cache","minor_heal","siege_breaker"]
 },
 dragon:{
  name:"용의 군주 덱",icon:"🐉",color:"#ff8e78",
  desc:"초반을 버틴 뒤 강력한 용과 후반 카드로 압도한다.",
  cards:["dragon_whelp","dragon_whelp","dragon_whelp","dragon_priest","dragon_priest","ember_dragon","ember_dragon","elder_dragon","elder_dragon","elder_dragon","rune_colossus","rune_colossus","arcane_titan","phoenix_guard","field_medic","iron_guard","iron_guard","sun_priest","arcane_sentinel","siege_golem","fire_bolt","minor_heal","tactical_draw","tactical_draw","arcane_burst","dragonfire","dragonfire","deep_focus","last_stand","supply_cache"]
 }
};

let selectedDeck="balanced";
let state=null;
let selectedCard=null;
let chosenLane=1;
let busy=false;

function shuffle(a){
 const b=[...a];
 for(let i=b.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [b[i],b[j]]=[b[j],b[i]];
 }
 return b;
}
function makeDeck(ids){
 return shuffle(ids.map(id=>CARD[id]).filter(Boolean));
}
function log(msg){
 const el=$("log");
 const line=document.createElement("div");
 line.className="logline";
 line.textContent=msg;
 el.prepend(line);
 while(el.children.length>70)el.lastChild.remove();
}
function renderDecks(){
 const grid=$("deckGrid");
 grid.innerHTML="";
 for(const [id,d] of Object.entries(DECKS)){
  const b=document.createElement("button");
  b.className="deckcard"+(selectedDeck===id?" selected":"");
  b.innerHTML=`<div class="deckicon">${d.icon}</div>
   <h3>${d.name}</h3><p>${d.desc}</p>
   <div class="deckmeta">30장 · 전략 카드 덱</div>`;
  b.onclick=()=>{selectedDeck=id;renderDecks()};
  grid.appendChild(b);
 }
}
renderDecks();

function newSide(deckId){
 return {
  hp:MAX_HP,maxHp:MAX_HP,mana:0,maxMana:0,gold:0,
  deck:makeDeck(DECKS[deckId].cards),hand:[],lanes:[[],[],[]],
  fatigue:0,shield:0
 };
}
function startGame(){
 state={
  turn:1,active:"player",ended:false,
  difficulty:$("difficulty").value,
  player:newSide(selectedDeck),
  enemy:newSide(["balanced","assassin","control","siege","swarm","dragon"][Math.floor(Math.random()*6)]),
  laneSelected:1
 };
 state.player.maxMana=1;
 state.player.mana=1;
 state.enemy.maxMana=1;
 state.enemy.mana=1;
 state.player.gold=0;
 state.enemy.gold=0;
 for(let i=0;i<4;i++)draw(state.player);
 for(let i=0;i<4;i++)draw(state.enemy);
 $("setup").style.display="none";
 $("game").style.display="block";
 $("overlay").style.display="none";
 $("log").innerHTML="";
 selectedCard=null;
 log("전투 시작! "+DECKS[selectedDeck].name+"으로 승리를 쟁취하세요.");
 log("AI 덱: "+state.enemy.deck.length+"장의 카드로 구성됩니다.");
 render();
}
function draw(side,n=1){
 for(let i=0;i<n;i++){
  if(side.hand.length>=10){
   log("손패가 가득 차 카드를 뽑지 못했습니다.");
   return;
  }
  if(side.deck.length===0){
   side.fatigue++;
   side.hp-=side.fatigue;
   log("덱이 비었습니다. 탈진 피해 "+side.fatigue+"!");
   continue;
  }
  side.hand.push(side.deck.pop());
 }
}
function enemyTarget(lane){
 const list=state.enemy.lanes[lane];
 return list.length?list[0]:null;
}
function playerTarget(lane){
 const list=state.player.lanes[lane];
 return list.length?list[0]:null;
}
function activeSide(){return state.active==="player"?state.player:state.enemy}
function otherSide(){return state.active==="player"?state.enemy:state.player}
function alive(unit){return unit.hp>0}
function cloneUnit(card,owner){
 return {
  id:card.id,name:card.name,emoji:card.emoji,atk:card.atk,hp:card.hp,
  maxHp:card.hp,shield:0,owner,tag:card.effect?.tag||"",
  attacks:0,attacked:false
 };
}
function applyUnitEffect(card,side,foe,lane){
 const e=card.effect||{};
 if(e.heal)side.hp=Math.min(side.maxHp,side.hp+e.heal);
 if(e.shield)side.shield+=e.shield;
 if(e.face)foe.hp-=e.face;
 if(e.draw)draw(side,e.draw);
 if(e.mana)side.mana=Math.min(side.maxMana,side.mana+e.mana);
 if(e.blast){
  const target=foe.lanes[lane][0];
  if(target)damageUnit(target,e.blast);
 }
 if(e.laneShield)side.lanes[lane].forEach(u=>u.shield+=e.laneShield);
 if(e.laneBuff)side.lanes[lane].forEach(u=>u.atk+=e.laneBuff);
 if(e.buff)side.lanes.flat().filter(u=>u!==side.lanes[lane].at(-1)).forEach(u=>u.atk+=e.buff);
 if(e.dragonBuff){
  const dragon=side.lanes.flat().find(u=>u.tag==="dragon");
  if(dragon){dragon.atk+=e.dragonBuff;dragon.maxHp+=e.dragonBuff;dragon.hp+=e.dragonBuff}
 }
 if(e.unitHeal){
  const u=side.lanes[lane][0];
  if(u)u.hp=Math.min(u.maxHp,u.hp+e.unitHeal);
 }
 if(e.laneDamage)foe.lanes[lane].forEach(u=>damageUnit(u,e.laneDamage));
}
function damageUnit(unit,n){
 let damage=n;
 if(unit.shield>0){
  const absorbed=Math.min(unit.shield,damage);
  unit.shield-=absorbed;damage-=absorbed;
 }
 unit.hp-=damage;
}
function castSpell(card,side,foe,lane){
 const e=card.effect||{};
 if(e.damage){
  const target=foe.lanes[lane][0];
  if(target)damageUnit(target,e.damage);
  else foe.hp-=Math.max(1,Math.floor(e.damage/2));
 }
 applyUnitEffect(card,side,foe,lane);
 cleanLanes();
}
function cleanLanes(){
 for(const side of [state.player,state.enemy]){
  side.lanes=side.lanes.map(l=>l.filter(alive));
 }
}
function playCard(index,lane){
 if(!state||state.ended||state.active!=="player"||busy)return;
 const side=state.player,foe=state.enemy;
 const card=side.hand[index];
 if(!card)return;
 if(card.cost>side.mana){
  $("actionHint").textContent="마나가 부족합니다.";
  return;
 }
 if(side.lanes[lane].length>=5&&card.type==="unit"){
  $("actionHint").textContent="해당 라인에 유닛을 더 배치할 수 없습니다.";
  return;
 }
 side.mana-=card.cost;
 side.hand.splice(index,1);
 if(card.type==="unit"){
  const u=cloneUnit(card,"player");
  side.lanes[lane].push(u);
  applyUnitEffect(card,side,foe,lane);
  log(`${card.name} 소환 · ${LANES[lane]}`);
 }else{
  castSpell(card,side,foe,lane);
  log(`${card.name} 사용 · ${LANES[lane]}`);
 }
 selectedCard=null;
 checkGameOver();
 render();
}
function render(){
 if(!state)return;
 $("turnTop").textContent=state.turn;
 $("goldTop").textContent=state.player.gold;
 $("deckTop").textContent=state.player.deck.length;
 $("playerMana").textContent=`${state.player.mana}/${state.player.maxMana}`;
 $("enemyMana").textContent=`${state.enemy.mana}/${state.enemy.maxMana}`;
 $("playerHPText").textContent=`${Math.max(0,state.player.hp)} / ${state.player.maxHp}`;
 $("enemyHPText").textContent=`${Math.max(0,state.enemy.hp)} / ${state.enemy.maxHp}`;
 $("playerHPBar").style.width=Math.max(0,state.player.hp/state.player.maxHp*100)+"%";
 $("enemyHPBar").style.width=Math.max(0,state.enemy.hp/state.enemy.maxHp*100)+"%";
 $("turninfo").innerHTML=`<b>${state.turn} 턴</b><br>${state.active==="player"?"내 차례":"AI 차례"}`;
 $("handCount").textContent=state.player.hand.length+"장";
 $("lanes").innerHTML="";
 for(let i=0;i<3;i++){
  const lane=document.createElement("div");
  lane.className="lane";
  lane.innerHTML=`<div class="lanehead"><strong>${LANES[i]}</strong>
  <button class="secondary" data-lane="${i}">이 라인 선택</button></div>
  <div class="units"></div>`;
  lane.querySelector("button").onclick=()=>{
   chosenLane=i;
   if(selectedCard!==null)playCard(selectedCard,i);
   else {$("actionHint").textContent=LANES[i]+" 선택됨";renderHand()}
  };
  const unitsEl=lane.querySelector(".units");
  const mine=state.player.lanes[i],foe=state.enemy.lanes[i];
  if(!mine.length&&!foe.length)unitsEl.innerHTML='<div class="empty">아직 유닛이 없습니다.</div>';
  for(const u of foe){
   const el=document.createElement("div");
   el.className="unit foe";
   el.innerHTML=`<div class="unitname">${u.emoji} ${u.name}</div>
   <div class="unitstats"><span class="atk">⚔ ${u.atk}</span><span class="hp">♥ ${u.hp}/${u.maxHp}</span><span class="shield">◆ ${u.shield}</span></div>`;
   unitsEl.appendChild(el);
  }
  if(foe.length&&mine.length){
   const divider=document.createElement("div");
   divider.className="empty";divider.textContent="⚔ 대치 중";
   unitsEl.appendChild(divider);
  }
  for(const u of mine){
   const el=document.createElement("div");
   el.className="unit mine";
   el.innerHTML=`<div class="unitname">${u.emoji} ${u.name}</div>
   <div class="unitstats"><span class="atk">⚔ ${u.atk}</span><span class="hp">♥ ${u.hp}/${u.maxHp}</span><span class="shield">◆ ${u.shield}</span></div>`;
   unitsEl.appendChild(el);
  }
  $("lanes").appendChild(lane);
 }
 renderHand();
}
function renderHand(){
 const hand=$("hand");
 hand.innerHTML="";
 if(!state)return;
 state.player.hand.forEach((c,i)=>{
  const b=document.createElement("button");
  b.className="card "+(c.type==="spell"?"spell ":"")+(selectedCard===i?"selected":"");
  b.disabled=state.active!=="player"||c.cost>state.player.mana;
  b.innerHTML=`<span class="cost">${c.cost}</span>
   <div class="emoji">${c.emoji}</div>
   <div class="name">${c.name}</div>
   <div class="kind">${c.type==="unit"?"유닛":"주문"}</div>
   <div class="desc">${c.desc}</div>
   <div class="stats">${c.type==="unit"?`⚔ ${c.atk}　♥ ${c.hp}`:"✨ 전술 효과"}</div>`;
  b.onclick=()=>{
   if(c.cost>state.player.mana)return;
   if(c.type==="unit"&&state.player.lanes[chosenLane].length>=5){
    $("actionHint").textContent="선택한 라인의 유닛이 가득 찼습니다.";return;
   }
   selectedCard=i;
   $("actionHint").textContent=`${c.name} 선택됨 · 라인을 선택해 사용하세요.`;
   renderHand();
  };
  hand.appendChild(b);
 });
}
function attackSide(side,foe,sideName){
 for(let lane=0;lane<3;lane++){
  for(const u of [...side.lanes[lane]]){
   if(!alive(u))continue;
   const target=foe.lanes[lane][0];
   if(target){
    damageUnit(target,u.atk);
    log(`${u.name}이(가) 적 ${target.name}에게 ${u.atk} 공격`);
   }else{
    foe.hp-=u.atk;
    log(`${u.name}이(가) 적 넥서스에 ${u.atk} 피해`);
   }
  }
 }
 cleanLanes();
}
function combat(){
 attackSide(state.player,state.enemy,"player");
 if(checkGameOver())return;
 attackSide(state.enemy,state.player,"enemy");
 cleanLanes();
 checkGameOver();
}
function beginTurn(side){
 side.maxMana=Math.min(10,side.maxMana+1);
 side.mana=side.maxMana;
 side.gold+=1;
 for(const lane of side.lanes){
  for(const u of lane){
   u.hp=Math.min(u.maxHp,u.hp+0);
  }
 }
 draw(side,1);
}
function endPlayerTurn(){
 if(!state||state.ended||state.active!=="player"||busy)return;
 busy=true;
 selectedCard=null;
 $("actionHint").textContent="전투 진행 중...";
 combat();
 if(state.ended){busy=false;return}
 state.turn++;
 state.active="enemy";
 beginTurn(state.enemy);
 render();
 setTimeout(()=>{
  aiTurn();
  busy=false;
 },400);
}
function aiTurn(){
 if(!state||state.ended)return;
 const ai=state.enemy,me=state.player;
 let safety=0;
 while(safety++<12){
  if(state.ended)break;
  const options=ai.hand
   .map((c,i)=>({c,i}))
   .filter(x=>x.c.cost<=ai.mana)
   .sort((a,b)=>aiScore(b.c,me,ai)-aiScore(a.c,me,ai));
  if(!options.length)break;
  const {c,i}=options[0];
  let lane=bestLaneForAI(c,ai,me);
  if(c.type==="unit"&&ai.lanes[lane].length>=5){
   lane=ai.lanes.findIndex(l=>l.length<5);
   if(lane<0)break;
  }
  ai.mana-=c.cost;
  ai.hand.splice(i,1);
  if(c.type==="unit"){
   ai.lanes[lane].push(cloneUnit(c,"enemy"));
   applyUnitEffect(c,ai,me,lane);
   log(`AI가 ${c.name} 소환`);
  }else{
   castSpell(c,ai,me,lane);
   log(`AI가 ${c.name} 사용`);
  }
  checkGameOver();
  if(state.ended)break;
 }
 render();
 if(state.ended)return;
 state.active="player";
 beginTurn(state.player);
 $("actionHint").textContent="내 차례입니다. 카드를 사용하거나 턴을 종료하세요.";
 render();
}
function aiScore(c,me,ai){
 let score=0;
 if(c.type==="unit"){
  score+=c.atk*1.25+c.hp*.85-c.cost*.25;
  if(c.effect?.heal&&ai.hp<20)score+=4;
  if(c.effect?.blast&&me.lanes.some(l=>l.length))score+=3;
  if(c.effect?.face&&me.hp<15)score+=3;
  if(c.effect?.shield)score+=1.5;
 }else{
  score+=1;
  const e=c.effect||{};
  if(e.damage)score+=me.lanes.some(l=>l.length)?4:1;
  if(e.heal&&ai.hp<22)score+=5;
  if(e.draw&&ai.hand.length<4)score+=3;
  if(e.laneDamage)score+=me.lanes.flat().length*1.5;
  if(e.face)score+=2;
 }
 const difficulty=state.difficulty;
 if(difficulty==="easy")score+=Math.random()*4;
 if(difficulty==="normal")score+=Math.random()*1.5;
 if(difficulty==="hard")score+=Math.random()*.4;
 return score;
}
function bestLaneForAI(c,ai,me){
 let best=0,bestScore=-999;
 for(let i=0;i<3;i++){
  let s=0;
  const enemy=me.lanes[i],own=ai.lanes[i];
  if(c.type==="unit"){
   s+=enemy.length*2;
   s+=own.length*.6;
   if(enemy.length&&enemy[0].atk>=c.hp)s+=2;
   if(own.length>=4)s-=5;
  }else{
   s+=enemy.length*1.5;
   if(c.effect?.heal&&ai.hp<20)s+=4;
   if(c.effect?.laneBuff)s+=own.length*2;
  }
  if(s>bestScore){bestScore=s;best=i}
 }
 return best;
}
function checkGameOver(){
 if(!state||state.ended)return true;
 if(state.player.hp<=0||state.enemy.hp<=0){
  state.ended=true;
  const win=state.enemy.hp<=0&&state.player.hp>0;
  $("resultTitle").textContent=win?"승리!":"패배";
  $("resultText").textContent=win?
   "적 넥서스를 파괴했습니다. 훌륭한 전략입니다!":
   "나의 넥서스가 파괴되었습니다. 덱 구성을 바꾸어 다시 도전하세요.";
  $("overlay").style.display="flex";
  render();
  return true;
 }
 return false;
}
$("startBtn").onclick=startGame;
$("endTurn").onclick=endPlayerTurn;
$("cancelCard").onclick=()=>{
 selectedCard=null;
 $("actionHint").textContent="선택을 취소했습니다.";
 renderHand();
};
$("restart").onclick=()=>{
 $("game").style.display="none";
 $("setup").style.display="block";
 $("overlay").style.display="none";
 state=null;selectedCard=null;
};
$("again").onclick=()=>{
 $("overlay").style.display="none";
 startGame();
};
</script>
</body>
